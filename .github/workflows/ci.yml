name: CI

# Runs on pull requests and on main. Pushing a branch on its own does not start CI:
# iterate locally, push when happy, and open a pull request to run the full suite once.
# (Required checks come from the pull_request run, so merging is unaffected.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request makes the earlier run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which of the slow jobs a change needs (docs/runbooks/ci-tiers.md). A skipped job counts as passed for the
  # required checks, so a notes-only change is not held up by 15 minutes of browser tests. On main everything runs.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      database: ${{ steps.filter.outputs.database }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "database=true" >> "$GITHUB_OUTPUT"
            echo "browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          echo "$files"
          # Database tests: anything under app/supabase, or the workflow itself.
          if echo "$files" | grep -qE '^(app/supabase/|\.github/)'; then db=true; else db=false; fi
          # Browser tests: anything that is not a note (docs/ or a markdown file).
          if echo "$files" | grep -vE '^docs/|\.md$' | grep -q .; then browser=true; else browser=false; fi
          echo "database=$db" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"

  app:
    name: Lint, typecheck, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Placeholder values: the build only needs them to exist. No real project is contacted.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build

  database:
    name: Migrations and security tests
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (applies all migrations)
        run: pnpm db:start
      - name: Run database tests
        run: pnpm db:test

  # The browser tests, split into four parallel jobs (each with its own local Supabase and dev server).
  e2e-shard:
    name: Browser tests shard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (database, auth, API, mailbox)
        run: pnpm stack:start
      - name: Write local environment file
        run: pnpm env:local --force
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: app/test-results

  # The one required check for the browser tests (the shards above are not named in the branch rules).
  e2e:
    name: Browser tests (real local Supabase)
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "shards: ${{ needs.e2e-shard.result }}"
          if [ "${{ needs.e2e-shard.result }}" = "success" ] || [ "${{ needs.e2e-shard.result }}" = "skipped" ]; then
            [ "${{ needs.changes.result }}" = "success" ]
          else
            exit 1
          fi
