name: Deploy database to dev

# Manual only. Applies the migrations in app/supabase/migrations to the hosted DEV
# Supabase project. Secrets come from the GitHub "dev" environment, never from the repo.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-dev-database

jobs:
  migrate:
    name: Apply migrations to dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Project refs are not secret. This is makerflow-dev.
      SUPABASE_PROJECT_REF: mbbfjhjzhilathupnxdb
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Link to the dev project
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show what would change
        run: pnpm exec supabase db push --dry-run
      - name: Apply migrations
        run: pnpm exec supabase db push
